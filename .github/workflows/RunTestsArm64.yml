name: Run Tests

# Evaluation workflow: runs the SAME unit + snapshot test scheme that Xcode Cloud
# runs ("Ugglan-Workspace" against Ugglan.xcworkspace), but on an Apple Silicon
# (arm64) GitHub-hosted runner instead of Xcode Cloud's Intel hosts.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: run-tests-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (arm64)
    # macos-26 is Apple Silicon (arm64)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      # Pin a fixed snapshot-failure output dir so we can collect it on failure.
      # The Tuist test action defaults SNAPSHOT_ARTIFACTS to a random /tmp/<uuid>
      # path; we override it for the whole xcodebuild invocation below.
      SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/__SnapshotFailures__

    steps:
      - name: Checkout ugglan
        uses: actions/checkout@v5

      # The committed project.xcproj (JSON) format needs Xcode 27.2+: newest installed 27.x at or above 27.2
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '^27.2'

      # iOS-specialised cache: persists Xcode DerivedData + the resolved SwiftPM
      # packages AND restores file modification times. The mtime restore is the
      # reason to use this over a plain actions/cache on DerivedData — Xcode keys
      # incremental-build freshness on mtimes, which `git checkout` resets, so a
      # naive cache yields no compile reuse. Keyed on Package.resolved so it
      # invalidates only when SPM dependencies actually change.
      - name: Xcode cache (DerivedData + SwiftPM)
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1
        with:
          key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-
          swiftpm-package-resolved-file: Ugglan.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # No generation step: the projects and codegen output are committed and built as is.
      # The verify-generated job checks they are up to date.

      # Same scheme + workspace as the Xcode Cloud "Tests" action. iPhone 16e is an
      # arm64 simulator on the arm64 runner and shares the iPhone 16 screen geometry
      # (6.1", 1179x2556 @3x) so snapshot baselines stay valid.
      # CODE_SIGNING_ALLOWED=NO mirrors the other CI build workflows.
      - name: Build and Test
        run: |
          mkdir -p "$SNAPSHOT_ARTIFACTS"
          xcodebuild test \
            -workspace Ugglan.xcworkspace \
            -scheme Ugglan-Workspace \
            -destination 'platform=iOS Simulator,name=iPhone 16e,OS=latest' \
            -resultBundlePath "${{ github.workspace }}/TestResults.xcresult" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            SNAPSHOT_ARTIFACTS="$SNAPSHOT_ARTIFACTS"

      - uses: slidoapp/xcresulttool@0930e06ae335d8c5e2d2f311ee98d495889a6103 # v3.1.1
        if: always()
        with:
          path: ${{ github.workspace }}/TestResults.xcresult
          show-passed-tests: false
          show-code-coverage: false

      # Mirrors what ci_scripts/ci_post_xcodebuild.sh-adjacent tooling collects:
      # the snapshot diff/failure images written to SNAPSHOT_ARTIFACTS, plus the
      # full result bundle for triage.
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-failures
          path: ${{ env.SNAPSHOT_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # Fails if the committed Tuist projects or SwiftGen output don't match their sources (manifests, assets,
  # strings). GraphQL codegen is not checked: it introspects the live dev schema, which changes on its own.
  verify-generated:
    name: Verify generated files
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout ugglan
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '^27.2'

      - name: Install mise + Tuist
        run: scripts/install-tuist.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SwiftGen binary
        uses: actions/cache@v5
        with:
          path: build/swiftgen-6.6.3
          key: ${{ runner.os }}-swiftgen-${{ hashFiles('scripts/swiftgen.sh') }}
          restore-keys: |
            ${{ runner.os }}-swiftgen-

      - name: Regenerate
        run: |
          scripts/swiftgen.sh
          tuist generate --no-open

      - name: Check for differences
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::Generated files are out of date. Run scripts/post-checkout.sh and commit the result."
            exit 1
          fi
