name: IncreaseVersionNumber

on:
  workflow_dispatch:
    inputs:
      versionNumber:
        description: "Version number"
        required: true
        
jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # agvtool can't read the JSON project.xcproj format, so set the version in the Info.plists directly
      # (PlistBuddy would re-sort the keys, so only the version string is replaced)
      - name: Bump version
        env:
          VERSION: ${{ github.event.inputs.versionNumber }}
        run: |
          for plist in Projects/App/Config/Production/Info.plist Projects/App/Config/Test/Info.plist Projects/NotificationService/Info.plist; do
            perl -0pi -e 's|(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*(</string>)|${1}$ENV{VERSION}${2}|' "$plist"
          done
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: "Update app version to ${{ github.event.inputs.versionNumber }}"
          title: "Update app version to ${{ github.event.inputs.versionNumber }}"
          body: "This PR was created automatically by the ProductionDeploy action, merge this so that XCode Cloud will build and upload to App Store."
          branch: "update-app-version/${{ github.event.inputs.versionNumber }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
