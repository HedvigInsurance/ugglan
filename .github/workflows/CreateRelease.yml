name: CreateRelease

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["App Store Connect Submit"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # agvtool can't read the JSON project.xcproj format, so read the version from the Info.plist
      - name: Get Version
        id: get-version
        run: echo version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Projects/App/Config/Production/Info.plist) >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          release_name: Release-${{ steps.get-version.outputs.version }}
          body: Release
          draft: false
          prerelease: false
