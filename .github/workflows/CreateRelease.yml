name: CreateRelease

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["App Store Connect Submit"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # Only reads a plist and calls the GitHub API, so no Xcode/macOS runner is needed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      # agvtool can't read the JSON project.xcproj format, so read the version from the Info.plist
      - name: Get Version
        id: get-version
        run: |
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Projects/App/Config/Production/Info.plist', 'rb'))['CFBundleShortVersionString'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # actions/create-release is archived; gh ships on every runner
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: gh release create "$VERSION" --title "Release-$VERSION" --notes "Release" --target "$GITHUB_SHA"
