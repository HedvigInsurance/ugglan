name: SwiftFormat

on:
  pull_request:
    branches: ["*"]
    # swift-format only touches Swift, so skip PRs that change none — a .strings-only
    # translations PR or a workflow-only PR shouldn't spin up a runner.
    paths:
      - "**/*.swift"
      - ".swift-format"

jobs:
  format:
    # swift-format is cross-platform, so this runs on Linux. The container pins the toolchain to the
    # swift-format branch in scripts/install-swift-format.sh — bump both together.
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Keyed on the install script so bumping the swift-format branch rebuilds it
      - name: Cache
        uses: actions/cache@v5
        with:
          path: build/swift-format
          key: ${{ runner.os }}-swift-format-${{ hashFiles('scripts/install-swift-format.sh') }}
      - name: Install Swift-Format
        run: scripts/install-swift-format.sh
      - name: Format
        run: scripts/format-ci.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Formatting"
          title: "Formatting: ${{ github.head_ref }}"
          body: "@${{ github.event.pull_request.user.login }} swift-format found changes that should be applied to your branch"
          branch: "formatting/${{ github.head_ref }}"
          base: ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
