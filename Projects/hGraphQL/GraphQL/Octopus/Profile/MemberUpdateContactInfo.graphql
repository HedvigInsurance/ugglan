mutation MemberUpdateContactInfo($input: MemberUpdateContactInfoInput!) {
  memberUpdateContactInfo(input: $input) {
    member {
        email
        phoneNumber
    }
    userError {
        message
    }
  }
}

mutation MemberUpdatePhoneNumber($input: MemberUpdatePhoneNumberInput!) {
  memberUpdatePhoneNumber(input: $input) {
    userError {
      message
    }
  }
}
