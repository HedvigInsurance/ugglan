query PuppyGuide {
  currentMember {
    puppyGuide {
      forYoungDog
      stories {
        categories
        content
        image
        name
        rating
        read
        subtitle
        title
      }
    }
  }
}

mutation PuppyGuideEngagement($name: String!, $rating: Int, $read: Boolean) {
  puppyGuideEngagement(engagement: {name: $name, rating: $rating, read: $read}) {
    success
  }
}
