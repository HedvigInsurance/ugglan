query TravelCertificate {
  currentMember {
    email
    firstName
    lastName
    activeContracts {
        id
        exposureDisplayName
        exposureDisplayNameShort
    }
    travelCertificateSpecifications {
      contractSpecifications {
        contractId
        minStartDate
        maxStartDate
        maxDurationDays
      }
    }
  }
}
