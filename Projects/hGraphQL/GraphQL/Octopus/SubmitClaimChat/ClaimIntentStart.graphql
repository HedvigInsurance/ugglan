mutation ClaimIntentStart {
  claimIntentStart {
    ...ClaimIntentFragment
  }
}


query ClaimIntentStartWithPreviousSteps($resume: Boolean!) {
  currentMember {
    resumableClaimIntent(resume: $resume) {
      ...ClaimIntentFragment
      previousSteps {
        ...ClaimIntentStepFragment
      }
    }
  }
}
